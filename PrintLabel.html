<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRINT BARCODE LABEL</title>

    <link href="/Content/css/mdi/materialdesignicons.min.css" rel="stylesheet">
    <link href="/Content/css/vuetify/vuetify.min.css" rel="stylesheet">
    <link href="/Content/css/slimselect.css" rel="stylesheet">
    <link href="/Content/css/site.css?v=260522" rel="stylesheet">

    <style>
        .msc-panel, .mab-bar { margin-bottom: 10px; }
        .form-panel { background: var(--bg-surface, #ffffff); border: 1px solid var(--border, #d1d5db); border-radius: 6px; padding: 20px; margin-bottom: 16px; }
        .form-title { font-size: 15px; font-weight: bold; color: var(--accent, #1565C0); margin-bottom: 16px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #eee; padding-bottom: 6px; }
        .form-list-layout { display: grid; grid-template-columns: 140px minmax(200px, 400px); row-gap: 14px; column-gap: 16px; align-items: center; }
        .form-list-layout .field-label { text-align: right; font-size: 13px; font-weight: 600; color: var(--text-main, #333); margin: 0; }
        .form-control { width: 100%; padding: 6px 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; outline: none; transition: border-color 0.2s; background-color: #fff; height: 32px; box-sizing: border-box; }
        .form-control:focus { border-color: var(--accent, #1565C0); }
        .form-control:disabled { background-color: #f5f5f5; cursor: not-allowed; color: #888; }
        .radio-group { display: flex; align-items: center; gap: 16px; height: 32px; }
        .radio-item { display: flex; align-items: center; gap: 4px; font-size: 13px; cursor: pointer; margin: 0; }
        fieldset { border: none; padding: 0; margin: 0; }
        fieldset:disabled .form-title { color: #999; }

        /* 💡 新增：Lot List 專用表格樣式 */
        .grid-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .grid-table th { background-color: #f0f0f0; border: 1px solid #ccc; padding: 6px; font-size: 13px; font-weight: bold; text-align: center; color: #333; }
        .grid-table td { border: 1px solid #ccc; padding: 2px; text-align: center; background-color: #fff; }
        .grid-table input[type="text"] { width: 100%; height: 26px; border: none; padding: 0 4px; outline: none; font-size: 13px; box-sizing: border-box; text-align: center; }
        .grid-table input[type="text"]:focus { background-color: #e8f0fe; }
        .grid-table input[readonly] { background-color: #f9f9f9; color: #666; }
        .grid-table input[type="checkbox"] { cursor: pointer; width: 16px; height: 16px; margin-top: 4px; }
    </style>
</head>
<body>
    <div id="app" class="page-layout" data-app>
        <mes-toolbar title="Print BarCode Label"></mes-toolbar>
        
        <div class="page-body">
            <mes-action-bar :buttons="actionButtons" :auto-add-close="true" @action="onAction"></mes-action-bar>

            <!-- 基礎列印條件區塊 -->
            <div class="form-panel">
                <div class="form-list-layout">
                    
                    <label class="field-label">Stage :</label>
                    <select class="form-control" v-model="form.stage" @change="onStageChange">
                        <option value="">-- Select Stage --</option>
                        <option v-for="opt in options.stages" :key="opt" :value="opt">{{ opt }}</option>
                    </select>

                    <label class="field-label">Label Format :</label>
                    <select class="form-control" v-model="form.labelFormat" @change="onLabelFormatChange">
                        <option value="">-- Select Format --</option>
                        <option v-for="opt in options.labelFormats" :key="opt" :value="opt">{{ opt }}</option>
                    </select>

                    <!-- 當啟用 Lot List 表格時，隱藏這個單一輸入框避免混淆 -->
                    <label class="field-label" v-show="!isLotListEnabled">Label Data :</label>
                    <input type="text" class="form-control" v-model="form.labelData" placeholder="輸入 Lot ID 或 Wafer ID" v-show="!isLotListEnabled">

                    <label class="field-label">Print Mode :</label>
                    <div class="radio-group">
                        <label class="radio-item"><input type="radio" v-model="form.printMode" value="Normal" @change="onPrintModeChange"> Normal</label>
                        <label class="radio-item"><input type="radio" v-model="form.printMode" value="Reprint" @change="onPrintModeChange"> Reprint</label>
                        <label class="radio-item"><input type="radio" v-model="form.printMode" value="Modify" @change="onPrintModeChange"> Modify</label>
                    </div>

                    <label class="field-label">Box Qty :</label>
                    <input type="number" class="form-control" v-model.number="form.boxQty" min="1" :disabled="!isBoxQtyEnabled">

                    <label class="field-label">Printer Server :</label>
                    <select class="form-control" v-model="form.printerServer">
                        <option value="">-- Select Server --</option>
                        <option v-for="opt in options.printerServers" :key="opt" :value="opt">{{ opt }}</option>
                    </select>

                    <label class="field-label">列印份數 :</label>
                    <input type="number" class="form-control" v-model.number="form.printQty" min="1" max="99">

                </div>
            </div>

            <!-- 💡 新增：動態 Lot List 區塊 (仿 VB Spread) -->
            <div class="form-panel" v-show="isLotListEnabled">
                <div class="form-title"><i class="mdi mdi-table"></i> Lot List</div>
                <div style="overflow-x: auto; max-height: 300px; overflow-y: auto;">
                    <table class="grid-table">
                        <thead>
                            <tr>
                                <th style="width: 40px;">No.</th>
                                <th style="width: 40px;"><input type="checkbox" @change="toggleAllLots" v-model="allLotsChecked" title="全選/取消全選"></th>
                                <th style="width: 150px;">Lot NO</th>
                                <th style="width: 150px;">Product NO</th>
                                <th style="width: 80px;">Wafer Qty</th>
                                <th style="width: 80px;">Chip Qty</th>
                                <th style="width: 100px;">Lot Owner</th>
                                <th style="width: 100px;">Speed</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr v-for="(row, index) in lotList" :key="index">
                                <td>{{ index + 1 }}</td>
                                <td><input type="checkbox" v-model="row.checked"></td>
                                <td>
                                    <!-- 離開焦點(blur)或按下 Enter 時，觸發後端查詢 -->
                                    <input type="text" v-model="row.lotNo" @blur="fetchLotInfo(row)" @keyup.enter="fetchLotInfo(row)">
                                </td>
                                <td><input type="text" v-model="row.productNo" readonly></td>
                                <td><input type="text" v-model="row.waferQty" readonly></td>
                                <td><input type="text" v-model="row.chipQty" readonly></td>
                                <td><input type="text" v-model="row.lotOwner" readonly></td>
                                <td><input type="text" v-model="row.speed" readonly></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- (以下保留您原本的 Reprint 與 LPI 區塊，因版面關係省略，請保持原本的 HTML 結構) -->
            
        </div>
        <mes-statusbar :msg="statusMsg" :msg-type="statusMsgType"></mes-statusbar>
    </div>

    <script src="/Scripts/vue.min.js"></script>
    <script src="/Scripts/vuetify.min.js"></script>
    <script src="/Scripts/slimselect.js"></script>
    <script src="/Scripts/mes-util.js?v=260522"></script>
    <script src="/Scripts/mes-action-bar.js"></script>

    <script>
        Vue.use(VMessageBox);

        var vapp = new Vue({
            el: '#app',
            data() {
                return {
                    form: {
                        stage: '', labelFormat: '', labelData: '', printMode: 'Normal', printerServer: '',
                        boxQty: 1, printQty: 1, reprintType: 'LastLabel', searchData: '',
                        lpiMode: 'Auto', lpiLabelSpecNo: '', carrierType: '', boxingSpecNo: '', brand: '', pinCount: '', packageCode: ''
                    },
                    options: {
                        stages: [], labelFormats: [], printerServers: [],
                        lpiLabelSpecs: [], carrierTypes: [], boxingSpecs: [], brands: [], pinCounts: [], packageCodes: []
                    },
                    // 💡 新增：Lot List 陣列
                    lotList: [],
                    allLotsChecked: false,
                    statusMsg: 'READY',
                    statusMsgType: ''
                };
            },
            computed: {
                actionButtons() {
                    return [
                        { action: 'print', label: 'Print', icon: 'mdi-printer', color: 'primary' },
                        { action: 'clear', label: 'Clear', icon: 'mdi-eraser' }
                    ];
                },
                // 💡 判斷哪些標籤需要顯示表格 (可依據您 VB6 程式碼中會使用到 spdLotList 的標籤擴充)
                isLotListEnabled() { 
                    const listFormats = ['WS_SMALL_LABEL', 'FT_SMALL_LABEL', 'CP_SMALL_LABEL']; 
                    return listFormats.includes(this.form.labelFormat);
                },
                isLabelPackEnabled() { return this.form.labelFormat === 'FT_Label_PACK_INFO'; },
                isBoxQtyEnabled() {
                    const singleLabels = [
                        "FT_SMALL_LABEL", "CP_SMALL_LABEL", "WS_SMALL_LABEL", "CP_VIRTUAL_LOT_LABEL", 
                        "CP_VIRTUAL_MERGE", "WS_SUMMARY", "WS_TO_SFG", "WS_DGRADE_SUMMARY", 
                        "FT_LOT_INFO", "FT_Label_PACK_INFO", "WS_MULTILOT_TO_SFG", "WSMCD_TO_SFG",
                        "FT_TR_LABEL", "FT_BOX_COUNTING", "FT_BIN_CARD_LABEL", "WS_ENG_LOC_LABEL"
                    ];
                    return !singleLabels.includes(this.form.labelFormat);
                }
            },
            mounted() { 
                this.loadInitData(); 
                this.initLotList(); // 初始化空白表格
            },
            methods: {
                // 💡 初始化 10 個空白列
                initLotList() {
                    this.lotList = [];
                    for(let i = 0; i < 10; i++) {
                        this.lotList.push({ checked: false, lotNo: '', productNo: '', waferQty: '', chipQty: '', lotOwner: '', speed: '' });
                    }
                },
                toggleAllLots() {
                    this.lotList.forEach(row => { row.checked = this.allLotsChecked; });
                },
                // 💡 當使用者輸入完 LotNo 離開焦點，呼叫 API 帶出資料
                async fetchLotInfo(row) {
                    if (!row.lotNo) {
                        // 若清空輸入，連帶清空其他資訊並取消勾選
                        row.productNo = ''; row.waferQty = ''; row.chipQty = ''; row.lotOwner = ''; row.speed = ''; row.checked = false;
                        return;
                    }

                    try {
                        // 呼叫我們剛剛在後端加的 API
                        const response = await mesfetch(`/api/print/print-label/lot-info/${row.lotNo}`, {}, 'GET');
                        if (response.Success && response.Data) {
                            row.productNo = response.Data.ProductNo || '';
                            row.waferQty = response.Data.WaferQty || '';
                            row.chipQty = response.Data.ChipQty || '';
                            row.lotOwner = response.Data.LotOwner || '';
                            row.speed = response.Data.Speed || '';
                            row.checked = true; // 自動打勾
                        } else {
                            VMessageBox.alert(response.Message || '查無此批號');
                            row.checked = false;
                        }
                    } catch (e) {
                        console.error(e);
                        row.checked = false;
                    }
                },
                
                // ... (保留原本的 loadInitData, onStageChange 等連動方法) ...
                async onLabelFormatChange() {
                    this.form.printerServer = '';
                    if (!this.form.stage || !this.form.labelFormat) return;

                    // 當切換為表格模式時，清空原本的表格以策安全
                    if (this.isLotListEnabled) {
                        this.initLotList();
                    }

                    try {
                        const response = await mesfetch("/api/print/print-label/mapped-servers", { Stage: this.form.stage, LabelFormat: this.form.labelFormat });
                        if (response.Success) this.options.printerServers = response.Data;
                    } catch (error) { console.error(error); }
                },

                // 💡 重寫 doPrint 支援多筆勾選列印
                async doPrint() {
                    if (!this.form.printerServer || !this.form.labelFormat) {
                        VMessageBox.alert('請選擇完整的伺服器與標籤格式！'); return;
                    }

                    let finalPrintMode = this.form.printMode;
                    if (this.form.labelFormat === 'FT_Label_PACK_INFO' && this.form.printMode === 'Normal') {
                        finalPrintMode = this.form.lpiMode;
                    }

                    // 收集要列印的 Lot 清單
                    let lotsToPrint = [];

                    if (this.isLotListEnabled) {
                        // 表格模式：過濾出有打勾且有填寫 LotNo 的列
                        lotsToPrint = this.lotList
                            .filter(row => row.checked && row.lotNo.trim() !== '')
                            .map(row => row.lotNo.trim());

                        if (lotsToPrint.length === 0) {
                            VMessageBox.alert('請至少勾選並輸入一筆 Lot NO 才能列印！'); return;
                        }
                    } else {
                        // 單一輸入模式
                        if (!this.form.labelData.trim() && this.form.printMode !== 'Reprint') {
                            VMessageBox.alert('請輸入 Label Data (Lot/Wafer)！'); return;
                        }
                        lotsToPrint.push(this.form.labelData.trim());
                    }

                    document.body.style.cursor = 'wait'; this.setStatus('PRINTING...', 'info');

                    // 💡 透過前端迴圈，針對每一筆 Lot 發送列印請求 (完全保護後端單純的設計)
                    try {
                        let allSuccess = true;
                        let errorMsg = '';

                        for (const currentLot of lotsToPrint) {
                            const payload = {
                                Stage: this.form.stage, LabelFormat: this.form.labelFormat, 
                                LotId: currentLot, /* 傳入迴圈當下的 Lot */
                                PrintMode: finalPrintMode, PrinterServer: this.form.printerServer, 
                                BoxQty: this.form.boxQty, PrintQty: this.form.printQty,
                                ReprintType: this.form.printMode === 'Reprint' ? this.form.reprintType : '', 
                                SearchData: this.form.printMode === 'Reprint' ? this.form.searchData : '',
                                LabelSpecNo: this.form.lpiLabelSpecNo, CarrierType: this.form.carrierType, 
                                BoxingSpecNo: this.form.boxingSpecNo, Brand: this.form.brand, 
                                PinCount: this.form.pinCount, PackageCode: this.form.packageCode,
                                UserId: window.checkAuth ? window.checkAuth().userName : 'System'
                            };

                            const res = await this.executeSinglePrint(payload);
                            if (!res.Success) {
                                allSuccess = false;
                                errorMsg += `Lot [${currentLot}] 失敗: ${res.Message}\n`;
                            }
                        }

                        if (allSuccess) {
                            VMessageBox.alert('標籤列印指令已全數成功送出！'); 
                            this.setStatus('PRINT SUCCESS', 'success');
                        } else {
                            VMessageBox.alert(errorMsg);
                            this.setStatus('PRINT COMPLETED WITH ERRORS', 'warning');
                        }
                    } finally { 
                        document.body.style.cursor = 'default'; 
                    }
                },

                // 拆分單一列印呼叫，方便迴圈使用
                async executeSinglePrint(payload) {
                    try {
                        const response = await mesfetch("/api/print/print-label/print", payload);
                        if (!response.Success && response.Message && response.Message.includes("REQUIRE_ORIGINAL_LOT")) {
                            // 攔截 InputBox 邏輯，利用 Promise 等待使用者輸入
                            return await new Promise((resolve) => {
                                VMessageBox.prompt(`Lot ${payload.LotId} 無母批資訊，請輸入原始批號：`, '補入資訊', { confirmButtonText: '確定', cancelButtonText: '取消' })
                                .then(async (result) => {
                                    if (result && result.value) { 
                                        payload.OriLotID = result.value.trim(); 
                                        resolve(await this.executeSinglePrint(payload)); 
                                    } else {
                                        resolve({ Success: false, Message: '使用者取消補入批號' });
                                    }
                                }).catch(() => { resolve({ Success: false, Message: '使用者取消' }); });
                            });
                        }
                        return response;
                    } catch (error) {
                        console.error(error);
                        return { Success: false, Message: '系統發生非預期錯誤' };
                    }
                },

                doClear() {
                    this.form.stage = ''; this.form.labelFormat = ''; this.form.labelData = ''; this.form.printMode = 'Normal';
                    this.form.printerServer = ''; this.form.boxQty = 1; this.form.printQty = 1; this.form.searchData = '';
                    this.form.lpiMode = 'Auto'; this.form.lpiLabelSpecNo = ''; this.clearLpiDropdowns(1); 
                    this.initLotList(); // 清空表格
                    this.setStatus('CLEARED', '');
                }
                // ... (其餘 doClose 等保留不變)
            }
        });
    </script>
</body>
</html>
