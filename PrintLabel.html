<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRINT BARCODE LABEL</title>

    <link href="/Content/css/mdi/materialdesignicons.min.css" rel="stylesheet">
    <link href="/Content/css/vuetify/vuetify.min.css" rel="stylesheet">
    <link href="/Content/css/slimselect.css" rel="stylesheet">
    <link href="/Content/css/site.css?v=260522" rel="stylesheet">

    <style>
        .msc-panel, .mab-bar { margin-bottom: 10px; }
        .form-panel { background: var(--bg-surface, #ffffff); border: 1px solid var(--border, #d1d5db); border-radius: 6px; padding: 20px; margin-bottom: 16px; }
        .form-title { font-size: 15px; font-weight: bold; color: var(--accent, #1565C0); margin-bottom: 16px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #eee; padding-bottom: 6px; }
        .form-list-layout { display: grid; grid-template-columns: 140px minmax(200px, 400px); row-gap: 14px; column-gap: 16px; align-items: center; }
        .form-list-layout .field-label { text-align: right; font-size: 13px; font-weight: 600; color: var(--text-main, #333); margin: 0; }
        .form-control { width: 100%; padding: 6px 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; outline: none; transition: border-color 0.2s; background-color: #fff; height: 32px; box-sizing: border-box; }
        .form-control:focus { border-color: var(--accent, #1565C0); }
        .form-control:disabled { background-color: #f5f5f5; cursor: not-allowed; color: #888; }
        .radio-group { display: flex; align-items: center; gap: 16px; height: 32px; }
        .radio-item { display: flex; align-items: center; gap: 4px; font-size: 13px; cursor: pointer; margin: 0; }
        fieldset { border: none; padding: 0; margin: 0; }
        .grid-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .grid-table th { background-color: #f0f0f0; border: 1px solid #ccc; padding: 6px; font-size: 13px; font-weight: bold; text-align: center; color: #333; }
        .grid-table td { border: 1px solid #ccc; padding: 2px; text-align: center; background-color: #fff; }
        .grid-table input[type="text"] { width: 100%; height: 26px; border: none; padding: 0 4px; outline: none; font-size: 13px; box-sizing: border-box; text-align: center; }
        .grid-table input[readonly] { background-color: #f9f9f9; color: #666; }
        .btn-ok { background-color: #f0f0f0; border: 1px solid #999; padding: 0 20px; height: 32px; border-radius: 4px; cursor: pointer; font-weight: bold; transition: all 0.2s; }
        .btn-ok:hover { background-color: #e0e0e0; border-color: #666; }
    </style>
</head>
<body>
    <div id="app" class="page-layout" data-app>
        <mes-toolbar title="Print BarCode Label"></mes-toolbar>
        
        <div class="page-body">
            <mes-action-bar :buttons="actionButtons" :auto-add-close="true" @action="onAction"></mes-action-bar>

            <!-- 基礎列印條件區塊 -->
            <div class="form-panel">
                <div class="form-list-layout">
                    
                    <label class="field-label">Stage :</label>
                    <select class="form-control" v-model="form.stage" @change="onStageChange">
                        <option value="">-- Select Stage --</option>
                        <option v-for="opt in options.stages" :key="opt" :value="opt">{{ opt }}</option>
                    </select>

                    <label class="field-label">Label Type :</label>
                    <select class="form-control" v-model="form.labelFormat" @change="onLabelFormatChange">
                        <option value="">-- Select Format --</option>
                        <option v-for="opt in options.labelFormats" :key="opt" :value="opt">{{ opt }}</option>
                    </select>

                    <!-- 一般單批輸入框隱藏邏輯 (加入 isWsEngShelfMode 防護) -->
                    <label class="field-label" v-show="!isLotListEnabled && !isWsEngShelfMode && !isBoxCountingMode && !isEtestMergeMode && !isLabelPackEnabled && !isTrLabelMode && !isSubLabelMode && !isRenesasMode && !isWsSummaryMode">Label Data :</label>
                    <input type="text" class="form-control" v-model="form.labelData" placeholder="輸入 Lot ID 或 Wafer ID" v-show="!isLotListEnabled && !isWsEngShelfMode && !isBoxCountingMode && !isEtestMergeMode && !isLabelPackEnabled && !isTrLabelMode && !isSubLabelMode && !isRenesasMode && !isWsSummaryMode">

                    <!-- 隱藏 Print Mode (加入 isWsEngShelfMode 防護) -->
                    <template v-if="!isBinCardMode && !isBoxCountingMode && !isEtestMergeMode && !isFtLotInfoMode && !isLabelPackEnabled && !isTrLabelMode && !isSubLabelMode && !isCpVirtualMode && !isRenesasMode && !isWsSummaryMode && !isWsEngShelfMode">
                        <label class="field-label">Print Mode :</label>
                        <div class="radio-group">
                            <label class="radio-item"><input type="radio" v-model="form.printMode" value="Normal" @change="onPrintModeChange"> Normal</label>
                            <label class="radio-item"><input type="radio" v-model="form.printMode" value="Reprint" @change="onPrintModeChange"> Reprint</label>
                            <label class="radio-item"><input type="radio" v-model="form.printMode" value="Modify" @change="onPrintModeChange"> Modify</label>
                        </div>
                    </template>

                    <label class="field-label">Printer Server :</label>
                    <select class="form-control" v-model="form.printerServer">
                        <option value="">-- Select Server --</option>
                        <option v-for="opt in options.printerServers" :key="opt" :value="opt">{{ opt }}</option>
                    </select>

                    <!-- 💡 WS_ENG_SHELF 保留 Box Qty 顯示 -->
                    <template v-if="!isBinCardMode && !isBoxCountingMode && !isFtLotInfoMode && !isLabelPackEnabled && !isTrLabelMode">
                        <label class="field-label">Box Qty :</label>
                        <input type="number" class="form-control" v-model.number="form.boxQty" min="1" :disabled="!isBoxQtyEnabled">
                    </template>

                    <template v-if="!isBinCardMode">
                        <label class="field-label">列印份數 :</label>
                        <input type="number" class="form-control" v-model.number="form.printQty" min="1" max="99">
                    </template>

                </div>
            </div>

            <!-- (省略保留其他專屬 Label Form：WS_SUMMARY、RENESAS、TO_SUB、TR_LABEL 等... 程式碼同上一版) -->
            <!-- 由於空間限制，此處僅貼出新增與變更的區塊，請保留原本的結構 -->

            <!-- 💡 新增：WS_ENG_SHELF 專屬精簡版 Lot List 表格 -->
            <div class="form-panel" v-show="isWsEngShelfMode">
                <div class="form-title"><i class="mdi mdi-table"></i> Lot List</div>
                <div style="overflow-x: auto; max-height: 300px; overflow-y: auto;">
                    <table class="grid-table">
                        <thead>
                            <tr>
                                <th style="width: 40px;">No.</th>
                                <th style="width: 40px;"><input type="checkbox" @change="toggleAllLots" v-model="allLotsChecked"></th>
                                <th style="width: 150px;">Lot No</th>
                                <th style="width: 100px;">WQty</th>
                                <th style="width: 120px;">OwnerID</th>
                                <th style="width: 120px;">OwnerDep</th>
                                <th style="width: 40px;"></th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- 共用 lotList 陣列，只綁定需要的欄位 -->
                            <tr v-for="(row, index) in lotList" :key="index">
                                <td>{{ index + 1 }}</td>
                                <td><input type="checkbox" v-model="row.checked"></td>
                                <td>
                                    <input type="text" ref="engShelfInputs" v-model="row.lotNo"
                                           @blur="fetchLotInfo(row)" @keyup.enter="handleEnter(row, index, 'engShelfInputs')"
                                           @keydown.down.prevent="handleDown(index, 'engShelfInputs')" @keydown.up.prevent="handleUp(index, 'engShelfInputs')">
                                </td>
                                <td><input type="text" v-model="row.waferQty" readonly></td>
                                <td><input type="text" v-model="row.lotOwner" readonly></td>
                                
                                <!-- 💡 巧妙借用 Route 欄位來存放並顯示 OwnerDep -->
                                <td><input type="text" v-model="row.route" readonly></td>
                                
                                <td>
                                    <button type="button" @click="removeRow(index)" title="刪除此列" style="border: none; background: transparent; cursor: pointer; color: #d32f2f; font-weight: bold;">✖</button>
                                </td>
                            </tr>
                            <tr>
                                <td colspan="7" style="text-align: left; padding: 4px;">
                                    <button type="button" @click="addNewRow" style="border: 1px dashed #ccc; background: #f9f9f9; padding: 4px 12px; cursor: pointer; color: #1565C0; font-size: 13px; width: 100%;">
                                        ➕ 點擊或按 [ ↓ ] 向下新增一列
                                    </button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- 原本的 Lot List 區塊 (加入 isLotListEnabled 防護) -->
            <div class="form-panel" v-show="isLotListEnabled">
                <!-- 略過保留原本 Lot List HTML 內容 -->
                <div class="form-title"><i class="mdi mdi-table"></i> Lot List</div>
                <div style="overflow-x: auto; max-height: 300px; overflow-y: auto;">
                    <table class="grid-table">
                        <!-- ... 表頭與內容維持上一版原樣 ... -->
                        <tbody>
                            <tr v-for="(row, index) in lotList" :key="index">
                                <!-- ... 略 ... -->
                                <td>
                                    <!-- 💡 確保這裡的 ref 叫做 lotInputs -->
                                    <input type="text" ref="lotInputs" v-model="row.lotNo"
                                           @blur="fetchLotInfo(row)" @keyup.enter="handleEnter(row, index, 'lotInputs')"
                                           @keydown.down.prevent="handleDown(index, 'lotInputs')" @keydown.up.prevent="handleUp(index, 'lotInputs')">
                                </td>
                                <!-- ... 略 ... -->
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
        <mes-statusbar :msg="statusMsg" :msg-type="statusMsgType"></mes-statusbar>
    </div>

    <script src="/Scripts/vue.min.js"></script>
    <script src="/Scripts/vuetify.min.js"></script>
    <script src="/Scripts/slimselect.js"></script>
    <script src="/Scripts/mes-util.js?v=260522"></script>
    <script src="/Scripts/mes-action-bar.js"></script>

    <script>
        Vue.use(VMessageBox);

        var vapp = new Vue({
            el: '#app',
            data() {
                return {
                    form: {
                        stage: '', labelFormat: '', labelData: '', printMode: 'Normal', printerServer: '',
                        boxQty: 1, printQty: 1, reprintType: 'LastLabel', searchData: '',
                        passSheet: 1, failSheet: 1, totalQty: '',
                        lpiMode: 'Auto', lpiLabelSpecNo: '', carrierType: '', boxingSpecNo: '', brand: '', pinCount: '', packageCode: '',
                        trIpn: '', trQtyReel: '', trReelId: '',
                        subProductNo: '', subQty: '', subPacker: '', subPartNo: '', subWaferQty: ''
                    },
                    options: { stages: [], labelFormats: [], printerServers: [], lpiLabelSpecs: [], carrierTypes: [], boxingSpecs: [], brands: [], pinCounts: [], packageCodes: [], trReelIds: [] },
                    lotList: [], etestList: [], allLotsChecked: false, statusMsg: 'READY', statusMsgType: ''
                };
            },
            computed: {
                actionButtons() { return [{ action: 'print', label: 'Print', icon: 'mdi-printer', color: 'primary' }, { action: 'clear', label: 'Clear', icon: 'mdi-eraser' }]; },
                
                // 💡 新增：WS_ENG_SHELF 判斷
                isWsEngShelfMode() { 
                    return this.form.labelFormat === 'WS_ENG_SHELF' || this.form.labelFormat === 'WS_ENG_LOC_LABEL'; 
                },

                // 💡 將 WS_ENG_SHELF 從共用 Lot List 中排除
                isLotListEnabled() {
                    const listFormats = ['WS_SMALL_LABEL', 'FT_SMALL_LABEL', 'CP_SMALL_LABEL', 'FT_BIN_CARD_LABEL', 'FT_BIN_CARD', 'FT_LOT_INFO', 'CP_VIRTUAL_LOT_LABEL', 'CP_VIRTUAL_MERGE'];
                    return listFormats.some(fmt => this.form.labelFormat && this.form.labelFormat.includes(fmt));
                },

                // (保留其他判斷旗標：isBinCardMode, isBoxCountingMode, isEtestMergeMode... 同上一版)
                isBinCardMode() { return this.form.labelFormat && this.form.labelFormat.includes('FT_BIN_CARD'); },
                isBoxCountingMode() { return this.form.labelFormat === 'FT_BOX_COUNTING'; },
                isEtestMergeMode() { return this.form.labelFormat === 'FT_ETEST_MERGE_LABEL' || this.form.labelFormat === 'FT_ETEST_MERGE'; },
                isFtLotInfoMode() { return this.form.labelFormat === 'FT_LOT_INFO'; },
                isLabelPackEnabled() { return this.form.labelFormat === 'FT_Label_PACK_INFO'; },
                isTrLabelMode() { return this.form.labelFormat === 'FT_TR_LABEL'; },
                isSubLabelMode() { return ['TO_SUBFT_ENG_SAMPLE', 'TO_SUBFT_NORMAL', 'TO_SUBMK_ENG_SAMPLE', 'TO_SUBMK_NORMAL', 'TO_SUBTR_ENG_SAMPLE', 'TO_SUBTR_NORMAL'].includes(this.form.labelFormat); },
                isRenesasMode() { return this.form.labelFormat === 'RENESAS_SHIPPING'; },
                isWsSummaryMode() { return this.form.labelFormat === 'WSMULTILOT_TO_SFG' || this.form.labelFormat === 'WS_DGRADE_SUMMARY'; },
                isCpVirtualMode() { return this.form.labelFormat === 'CP_VIRTUAL_LOT_LABEL' || this.form.labelFormat === 'CP_VIRTUAL_MERGE'; },
                
                isBoxQtyEnabled() {
                    const singleLabels = ["FT_SMALL_LABEL", "CP_SMALL_LABEL", "WS_SMALL_LABEL", "CP_VIRTUAL_LOT_LABEL", "CP_VIRTUAL_MERGE", "WS_SUMMARY", "WS_TO_SFG", "WS_DGRADE_SUMMARY", "FT_LOT_INFO", "FT_Label_PACK_INFO", "WS_MULTILOT_TO_SFG", "WSMCD_TO_SFG", "FT_TR_LABEL", "FT_BOX_COUNTING", "FT_BIN_CARD_LABEL", "WS_ENG_LOC_LABEL", "FT_BIN_CARD", "FT_ETEST_MERGE_LABEL", "FT_ETEST_MERGE", "WS_ENG_SHELF"];
                    return !singleLabels.some(fmt => this.form.labelFormat && this.form.labelFormat.includes(fmt));
                }
            },
            mounted() { this.loadInitData(); },
            methods: {
                // 💡 修改方向鍵與 Enter 處理邏輯，讓它支援不同的 ref (lotInputs 與 engShelfInputs)
                handleDown(index, refName = 'lotInputs') {
                    if (index === this.lotList.length - 1) this.addNewRow();
                    this.$nextTick(() => { 
                        if (this.$refs[refName] && this.$refs[refName][index + 1]) {
                            this.$refs[refName][index + 1].focus(); 
                        }
                    });
                },
                handleUp(index, refName = 'lotInputs') { 
                    if (index > 0 && this.$refs[refName] && this.$refs[refName][index - 1]) {
                        this.$refs[refName][index - 1].focus(); 
                    }
                },
                handleEnter(row, index, refName = 'lotInputs') { 
                    this.fetchLotInfo(row); 
                    this.handleDown(index, refName); 
                },

                // 💡 fetchLotInfo 完美共用！後端會根據 LabelFormat (WS_ENG_SHELF) 自動切換查詢邏輯
                async fetchLotInfo(row) {
                    if (!row.lotNo) {
                        row.productNo = ''; row.waferQty = ''; row.chipQty = ''; row.lotOwner = ''; row.speed = ''; row.route = ''; row.step = ''; row.checked = false;
                        return;
                    }
                    try {
                        const response = await mesfetch("/api/print/print-label/lot-info", { LotId: row.lotNo, LabelFormat: this.form.labelFormat });
                        if (response.Success && response.Data) {
                            row.productNo = response.Data.ProductNo || ''; 
                            row.waferQty = response.Data.WaferQty || ''; 
                            row.chipQty = response.Data.ChipQty || '';
                            row.lotOwner = response.Data.LotOwner || ''; 
                            row.speed = response.Data.Speed || ''; 
                            row.route = response.Data.Route || ''; // WS_ENG_SHELF 的 OwnerDep 會塞在這裡
                            row.step = response.Data.Step || '';
                            row.checked = true;
                        } else {
                            VMessageBox.alert(response.Message || '查無此批號'); row.checked = false;
                        }
                    } catch (e) { console.error(e); row.checked = false; }
                },
                async onLabelFormatChange() {
                    this.form.printerServer = '';
                    if (!this.form.stage || !this.form.labelFormat) return;
                    
                    // 💡 修正 1：將 isWsEngShelfMode 也加入初始化 Lot List 的判斷中
                    if (this.isLotListEnabled || this.isWsEngShelfMode) this.initLotList();
                    
                    if (this.isEtestMergeMode) { this.form.labelData = ''; this.form.totalQty = ''; this.initEtestList(); }
                    if (this.isLabelPackEnabled) { this.setLpiMode('Auto'); this.form.labelData = ''; }
                    
                    // 重置共用表單
                    if (this.isSubLabelMode || this.isRenesasMode || this.isWsSummaryMode) {
                        this.form.labelData = ''; this.form.subProductNo = ''; this.form.subQty = '';
                        this.form.subPartNo = ''; this.form.subWaferQty = '';
                    }

                    try {
                        const response = await mesfetch("/api/print/print-label/mapped-servers", { Stage: this.form.stage, LabelFormat: this.form.labelFormat });
                        if (response.Success) this.options.printerServers = response.Data;
                    } catch (error) { console.error(error); }
                },
                // (其餘初始化、API 呼叫與 doPrint 等所有方法皆保持原樣，因為 WsEngShelf 與一般的 LotList 列印邏輯完全共用 lotsToPrint 收集機制！)
                // ... 省略重複代碼 ...
            },
            async doPrint() {
                    if (this.isBinCardMode) { VMessageBox.alert('FT BIN CARD 標籤請使用右方的 Pass / Fail 按鈕進行列印！'); return; }
                    if (!this.form.printerServer || !this.form.labelFormat) { VMessageBox.alert('請選擇完整的伺服器與標籤格式！'); return; }

                    let lotsToPrint = [];
                    
                    if (this.isSubLabelMode || this.isRenesasMode || this.isWsSummaryMode) {
                        if (!this.form.labelData.trim() || !this.form.subProductNo) {
                            VMessageBox.alert('請輸入 LOT NO 並確認批號資訊已載入！'); return;
                        }
                        if (this.form.boxQty <= 0) {
                            VMessageBox.alert('請輸入正確的 Box Qty (箱數)！'); return;
                        }
                        lotsToPrint.push(this.form.labelData.trim());
                    }
                    else if (this.isTrLabelMode) {
                        if (!this.form.labelData.trim() || !this.form.trReelId) { VMessageBox.alert('請輸入 Lot NO 並確認 Reel ID 是否選定！'); return; }
                        lotsToPrint.push(this.form.labelData.trim());
                    }
                    else if (this.isLabelPackEnabled && this.form.lpiMode === 'Manual') {
                        if (!this.form.lpiLabelSpecNo || !this.form.packageCode) { VMessageBox.alert('請選擇完整的 Label Pack 手動參數！'); return; }
                        lotsToPrint.push(''); 
                    } 
                    // 💡 修正 2：將 isWsEngShelfMode 視為表格模式，去抓取表格中被打勾的項目
                    else if (this.isLotListEnabled || this.isWsEngShelfMode) {
                        lotsToPrint = this.lotList.filter(row => row.checked && row.lotNo.trim() !== '').map(row => row.lotNo.trim());
                        if (lotsToPrint.length === 0) { VMessageBox.alert('請至少勾選一筆 Lot 才能列印！'); return; }
                    } 
                    else {
                        if (!this.form.labelData.trim() && this.form.printMode !== 'Reprint') { VMessageBox.alert('請輸入 LOT NO 或 Label Data！'); return; }
                        lotsToPrint.push(this.form.labelData.trim());
                    }

                    let finalPrintMode = this.form.printMode;
                    if (this.isLabelPackEnabled) finalPrintMode = this.form.lpiMode;
                    if (this.isSubLabelMode || this.isRenesasMode || this.isWsSummaryMode) finalPrintMode = 'Normal'; 

                    document.body.style.cursor = 'wait'; this.setStatus('PRINTING...', 'info');
                    try {
                        let allSuccess = true; let errorMsg = '';
                        for (const currentLot of lotsToPrint) {
                            const payload = {
                                Stage: this.form.stage, LabelFormat: this.form.labelFormat, LotId: currentLot,
                                PrintMode: finalPrintMode, PrinterServer: this.form.printerServer,
                                BoxQty: this.form.boxQty, PrintQty: this.form.printQty,
                                SearchData: this.form.searchData,
                                
                                WaferId: this.isTrLabelMode ? this.form.trReelId : '',
                                IPN: this.isTrLabelMode ? this.form.trIpn : ((this.isSubLabelMode || this.isRenesasMode || this.isWsSummaryMode) ? this.form.subProductNo : ''),
                                CQty: (this.isSubLabelMode || this.isRenesasMode || this.isWsSummaryMode) ? this.form.subQty : '',
                                WQty: (this.isRenesasMode || this.isWsSummaryMode) ? this.form.subWaferQty : '',
                                
                                UserId: (this.isSubLabelMode || this.isRenesasMode || this.isWsSummaryMode) ? this.form.subPacker : (window.checkAuth ? window.checkAuth().userName : 'System')
                            };
                            
                            const res = await this.executeSinglePrint(payload);
                            if (!res.Success) { allSuccess = false; errorMsg += `Lot [${currentLot}] 失敗: ${res.Message}\n`; }
                        }
                        if (allSuccess) { VMessageBox.alert('標籤列印指令已全數成功送出！'); this.setStatus('PRINT SUCCESS', 'success'); }
                        else { VMessageBox.alert(errorMsg); this.setStatus('COMPLETED WITH ERRORS', 'warning'); }
                    } finally { document.body.style.cursor = 'default'; }
                },
        });
    </script>
</body>
</html>
