<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRINT BARCODE LABEL</title>

    <link href="/Content/css/mdi/materialdesignicons.min.css" rel="stylesheet">
    <link href="/Content/css/vuetify/vuetify.min.css" rel="stylesheet">
    <link href="/Content/css/slimselect.css" rel="stylesheet">
    <link href="/Content/css/site.css?v=260522" rel="stylesheet">

    <style>
        .msc-panel, .mab-bar { margin-bottom: 10px; }
        .form-panel { background: var(--bg-surface, #ffffff); border: 1px solid var(--border, #d1d5db); border-radius: 6px; padding: 20px; margin-bottom: 16px; }
        .form-title { font-size: 15px; font-weight: bold; color: var(--accent, #1565C0); margin-bottom: 16px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #eee; padding-bottom: 6px; }
        .form-list-layout { display: grid; grid-template-columns: 140px minmax(200px, 400px); row-gap: 14px; column-gap: 16px; align-items: center; }
        .form-list-layout .field-label { text-align: right; font-size: 13px; font-weight: 600; color: var(--text-main, #333); margin: 0; }
        .form-control { width: 100%; padding: 6px 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; outline: none; transition: border-color 0.2s; background-color: #fff; height: 32px; box-sizing: border-box; }
        .form-control:focus { border-color: var(--accent, #1565C0); }
        .form-control:disabled { background-color: #f5f5f5; cursor: not-allowed; color: #888; }
        .radio-group { display: flex; align-items: center; gap: 16px; height: 32px; }
        .radio-item { display: flex; align-items: center; gap: 4px; font-size: 13px; cursor: pointer; margin: 0; }
        fieldset { border: none; padding: 0; margin: 0; }
        
        /* 表格樣式 */
        .grid-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .grid-table th { background-color: #f0f0f0; border: 1px solid #ccc; padding: 6px; font-size: 13px; font-weight: bold; text-align: center; color: #333; }
        .grid-table td { border: 1px solid #ccc; padding: 2px; text-align: center; background-color: #fff; }
        .grid-table input[type="text"] { width: 100%; height: 26px; border: none; padding: 0 4px; outline: none; font-size: 13px; box-sizing: border-box; text-align: center; }
        .grid-table input[type="text"]:focus { background-color: #e8f0fe; }
        .grid-table input[readonly] { background-color: #f9f9f9; color: #666; }
        .btn-ok { background-color: #f0f0f0; border: 1px solid #999; padding: 0 20px; height: 32px; border-radius: 4px; cursor: pointer; font-weight: bold; transition: all 0.2s; }
        .btn-ok:hover { background-color: #e0e0e0; border-color: #666; }
    </style>
</head>
<body>
    <div id="app" class="page-layout" data-app>
        <mes-toolbar title="Print BarCode Label"></mes-toolbar>
        
        <div class="page-body">
            <mes-action-bar :buttons="actionButtons" :auto-add-close="true" @action="onAction"></mes-action-bar>

            <!-- 基礎列印條件區塊 -->
            <div class="form-panel">
                <div class="form-list-layout">
                    
                    <label class="field-label">Stage :</label>
                    <select class="form-control" v-model="form.stage" @change="onStageChange">
                        <option value="">-- Select Stage --</option>
                        <option v-for="opt in options.stages" :key="opt" :value="opt">{{ opt }}</option>
                    </select>

                    <label class="field-label">Label Type :</label>
                    <select class="form-control" v-model="form.labelFormat" @change="onLabelFormatChange">
                        <option value="">-- Select Format --</option>
                        <option v-for="opt in options.labelFormats" :key="opt" :value="opt">{{ opt }}</option>
                    </select>

                    <!-- 一般單批輸入框隱藏邏輯 -->
                    <label class="field-label" v-show="!isLotListEnabled && !isBoxCountingMode && !isEtestMergeMode">Label Data :</label>
                    <input type="text" class="form-control" v-model="form.labelData" placeholder="輸入 Lot ID 或 Wafer ID" v-show="!isLotListEnabled && !isBoxCountingMode && !isEtestMergeMode">

                    <template v-if="!isBinCardMode && !isBoxCountingMode && !isEtestMergeMode">
                        <label class="field-label">Print Mode :</label>
                        <div class="radio-group">
                            <label class="radio-item"><input type="radio" v-model="form.printMode" value="Normal" @change="onPrintModeChange"> Normal</label>
                            <label class="radio-item"><input type="radio" v-model="form.printMode" value="Reprint" @change="onPrintModeChange"> Reprint</label>
                            <label class="radio-item"><input type="radio" v-model="form.printMode" value="Modify" @change="onPrintModeChange"> Modify</label>
                        </div>
                    </template>

                    <!-- 根據截圖，EtestMerge 會顯示 BoxQty，但可能是唯讀或空白 -->
                    <template v-if="!isBinCardMode && !isBoxCountingMode">
                        <label class="field-label">Box Qty :</label>
                        <input type="number" class="form-control" v-model.number="form.boxQty" min="1" :disabled="!isBoxQtyEnabled || isEtestMergeMode">
                    </template>

                    <label class="field-label">Printer Server :</label>
                    <select class="form-control" v-model="form.printerServer">
                        <option value="">-- Select Server --</option>
                        <option v-for="opt in options.printerServers" :key="opt" :value="opt">{{ opt }}</option>
                    </select>

                    <template v-if="!isBinCardMode">
                        <label class="field-label">列印份數 :</label>
                        <input type="number" class="form-control" v-model.number="form.printQty" min="1" max="99">
                    </template>

                    <!-- FT_BIN_CARD 專屬輸入區塊保留不變 -->
                    <template v-if="isBinCardMode">
                        <!-- ... 略 ... -->
                    </template>

                </div>
            </div>

            <!-- 💡 新增：FT_ETEST_MERGE_LABEL 專屬區塊 -->
            <div class="form-panel" v-show="isEtestMergeMode">
                <div class="form-title"><i class="mdi mdi-form-textbox"></i> Label Form</div>
                
                <!-- 第一列：LOT NO 與 QTY -->
                <div style="display: flex; gap: 20px; align-items: center; margin-bottom: 12px; padding-left: 20px;">
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <label style="font-size: 13px; font-weight: bold; width: 100px; text-align: right;">(1T) LOT NO:</label>
                        <!-- 綁定 form.labelData 並監聽 Enter 與離開焦點事件 -->
                        <input type="text" class="form-control" style="width: 200px;" v-model="form.labelData" @blur="fetchEtestInfo" @keyup.enter="fetchEtestInfo">
                    </div>
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <label style="font-size: 13px; font-weight: bold; width: 40px; text-align: right;">QTY:</label>
                        <input type="text" class="form-control" style="width: 120px; background-color: #d1d5db;" v-model="form.totalQty" readonly>
                    </div>
                </div>

                <!-- 第二列：子批號表格 -->
                <div style="width: 60%; margin: 0 auto;">
                    <table class="grid-table">
                        <thead>
                            <tr>
                                <th style="width: 40px;"></th>
                                <th>ChildLotID</th>
                                <th>Qty</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr v-for="(row, index) in etestList" :key="index">
                                <td style="background-color: #f0f0f0; border-right: 1px solid #999;">{{ index + 1 }}</td>
                                <td><input type="text" v-model="row.childLotId" readonly></td>
                                <td><input type="text" v-model="row.qty" readonly></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- 略過保留：FT_BOX_COUNTING 區塊、Lot List 區塊、Reprint 區塊 -->
            <!-- ... 原本程式碼 ... -->
            
        </div>
        <mes-statusbar :msg="statusMsg" :msg-type="statusMsgType"></mes-statusbar>
    </div>

    <script src="/Scripts/vue.min.js"></script>
    <script src="/Scripts/vuetify.min.js"></script>
    <script src="/Scripts/slimselect.js"></script>
    <script src="/Scripts/mes-util.js?v=260522"></script>
    <script src="/Scripts/mes-action-bar.js"></script>

    <script>
        Vue.use(VMessageBox);

        var vapp = new Vue({
            el: '#app',
            data() {
                return {
                    form: {
                        stage: '', labelFormat: '', labelData: '', printMode: 'Normal', printerServer: '',
                        boxQty: 1, printQty: 1, reprintType: 'LastLabel', searchData: '',
                        passSheet: 1, failSheet: 1, totalQty: '', // 新增 totalQty
                        lpiMode: 'Auto', lpiLabelSpecNo: '', carrierType: '', boxingSpecNo: '', brand: '', pinCount: '', packageCode: ''
                    },
                    options: { stages: [], labelFormats: [], printerServers: [], lpiLabelSpecs: [], carrierTypes: [], boxingSpecs: [], brands: [], pinCounts: [], packageCodes: [] },
                    lotList: [],
                    etestList: [], // 💡 新增：Etest Merge 子批號清單
                    allLotsChecked: false, statusMsg: 'READY', statusMsgType: ''
                };
            },
            computed: {
                actionButtons() { return [ { action: 'print', label: 'Print', icon: 'mdi-printer', color: 'primary' }, { action: 'clear', label: 'Clear', icon: 'mdi-eraser' } ]; },
                isBinCardMode() { return this.form.labelFormat && this.form.labelFormat.includes('FT_BIN_CARD'); },
                isBoxCountingMode() { return this.form.labelFormat === 'FT_BOX_COUNTING'; },
                // 💡 新增：判斷是否為 ETEST_MERGE
                isEtestMergeMode() { return this.form.labelFormat === 'FT_ETEST_MERGE_LABEL' || this.form.labelFormat === 'FT_ETEST_MERGE'; },
                
                isLotListEnabled() { 
                    const listFormats = ['WS_SMALL_LABEL', 'FT_SMALL_LABEL', 'CP_SMALL_LABEL', 'FT_BIN_CARD_LABEL', 'FT_BIN_CARD']; 
                    return listFormats.some(fmt => this.form.labelFormat && this.form.labelFormat.includes(fmt));
                },
                isLabelPackEnabled() { return this.form.labelFormat === 'FT_Label_PACK_INFO'; },
                isBoxQtyEnabled() {
                    const singleLabels = [ "FT_SMALL_LABEL", "CP_SMALL_LABEL", "WS_SMALL_LABEL", "CP_VIRTUAL_LOT_LABEL", "CP_VIRTUAL_MERGE", "WS_SUMMARY", "WS_TO_SFG", "WS_DGRADE_SUMMARY", "FT_LOT_INFO", "FT_Label_PACK_INFO", "WS_MULTILOT_TO_SFG", "WSMCD_TO_SFG", "FT_TR_LABEL", "FT_BOX_COUNTING", "FT_BIN_CARD_LABEL", "WS_ENG_LOC_LABEL", "FT_BIN_CARD", "FT_ETEST_MERGE_LABEL", "FT_ETEST_MERGE" ];
                    return !singleLabels.some(fmt => this.form.labelFormat && this.form.labelFormat.includes(fmt));
                }
            },
            mounted() { this.loadInitData(); this.initLotList(); this.initEtestList(); },
            methods: {
                // 💡 初始化 5 列空白的 Etest 子批號表格
                initEtestList() {
                    this.etestList = [];
                    for(let i = 0; i < 5; i++) {
                        this.etestList.push({ childLotId: '', qty: '' });
                    }
                },
                
                // 💡 呼叫後端查詢 Etest Merge 資訊
                async fetchEtestInfo() {
                    if (!this.form.labelData) {
                        this.form.totalQty = '';
                        this.initEtestList();
                        return;
                    }

                    try {
                        const response = await mesfetch("/api/print/print-label/etest-merge-info", { LotId: this.form.labelData.trim() });
                        
                        if (response.Success && response.Data) {
                            this.form.totalQty = response.Data.TotalQty || '';
                            
                            // 更新表格，補齊到至少 5 列以維持畫面美觀
                            this.etestList = response.Data.ChildLots || [];
                            while (this.etestList.length < 5) {
                                this.etestList.push({ childLotId: '', qty: '' });
                            }
                        } else {
                            VMessageBox.alert(response.Message || '查無此批號的 Merge 資訊');
                            this.form.totalQty = '';
                            this.initEtestList();
                        }
                    } catch (e) {
                        console.error(e);
                        this.form.totalQty = '';
                        this.initEtestList();
                    }
                },

                // (保留其餘方法: initLotList, fetchLotInfo, loadInitData, onStageChange 等...)
                
                async onLabelFormatChange() {
                    this.form.printerServer = '';
                    if (!this.form.stage || !this.form.labelFormat) return;
                    if (this.isLotListEnabled) this.initLotList();
                    if (this.isEtestMergeMode) { this.form.labelData = ''; this.form.totalQty = ''; this.initEtestList(); }
                    
                    try {
                        const response = await mesfetch("/api/print/print-label/mapped-servers", { Stage: this.form.stage, LabelFormat: this.form.labelFormat });
                        if (response.Success) this.options.printerServers = response.Data;
                    } catch (error) { console.error(error); }
                },

                async doPrint() {
                    if (this.isBinCardMode) { VMessageBox.alert('FT BIN CARD 標籤請使用右方的 Pass / Fail 按鈕進行列印！'); return; }
                    if (!this.form.printerServer || !this.form.labelFormat) { VMessageBox.alert('請選擇完整的伺服器與標籤格式！'); return; }

                    let lotsToPrint = [];
                    if (this.isLotListEnabled) {
                        lotsToPrint = this.lotList.filter(row => row.checked && row.lotNo.trim() !== '').map(row => row.lotNo.trim());
                        if (lotsToPrint.length === 0) { VMessageBox.alert('請至少勾選一筆 Lot 才能列印！'); return; }
                    } else {
                        // 一般模式、BoxCounting、EtestMerge 皆驗證此欄位
                        if (!this.form.labelData.trim() && this.form.printMode !== 'Reprint') { 
                            VMessageBox.alert('請輸入 Lot ID 或 Label Data！'); return; 
                        }
                        lotsToPrint.push(this.form.labelData.trim());
                    }

                    document.body.style.cursor = 'wait'; this.setStatus('PRINTING...', 'info');
                    try {
                        let allSuccess = true; let errorMsg = '';
                        for (const currentLot of lotsToPrint) {
                            const payload = {
                                Stage: this.form.stage, LabelFormat: this.form.labelFormat, LotId: currentLot, 
                                PrintMode: this.form.printMode, PrinterServer: this.form.printerServer, 
                                BoxQty: this.form.boxQty, PrintQty: this.form.printQty,
                                ReprintType: this.form.printMode === 'Reprint' ? this.form.reprintType : '', 
                                SearchData: this.form.printMode === 'Reprint' ? this.form.searchData : '',
                                UserId: window.checkAuth ? window.checkAuth().userName : 'System'
                            };
                            const res = await this.executeSinglePrint(payload);
                            if (!res.Success) { allSuccess = false; errorMsg += `Lot [${currentLot}] 失敗: ${res.Message}\n`; }
                        }
                        if (allSuccess) { VMessageBox.alert('標籤列印指令已全數成功送出！'); this.setStatus('PRINT SUCCESS', 'success'); }
                        else { VMessageBox.alert(errorMsg); this.setStatus('COMPLETED WITH ERRORS', 'warning'); }
                    } finally { document.body.style.cursor = 'default'; }
                }
            }
        });
    </script>
</body>
</html>
