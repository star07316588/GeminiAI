<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRINT BARCODE LABEL</title>

    <link href="/Content/css/mdi/materialdesignicons.min.css" rel="stylesheet">
    <link href="/Content/css/vuetify/vuetify.min.css" rel="stylesheet">
    <link href="/Content/css/slimselect.css" rel="stylesheet">
    <link href="/Content/css/site.css?v=260522" rel="stylesheet">

    <style>
        .msc-panel, .mab-bar { margin-bottom: 10px; }
        .form-panel { background: var(--bg-surface, #ffffff); border: 1px solid var(--border, #d1d5db); border-radius: 6px; padding: 20px; margin-bottom: 16px; }
        .form-title { font-size: 15px; font-weight: bold; color: var(--accent, #1565C0); margin-bottom: 16px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #eee; padding-bottom: 6px; }
        .form-list-layout { display: grid; grid-template-columns: 140px minmax(200px, 400px); row-gap: 14px; column-gap: 16px; align-items: center; }
        .form-list-layout .field-label { text-align: right; font-size: 13px; font-weight: 600; color: var(--text-main, #333); margin: 0; }
        .form-control { width: 100%; padding: 6px 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; outline: none; transition: border-color 0.2s; background-color: #fff; height: 32px; box-sizing: border-box; }
        .form-control:focus { border-color: var(--accent, #1565C0); }
        .form-control:disabled { background-color: #f5f5f5; cursor: not-allowed; color: #888; }
        .radio-group { display: flex; align-items: center; gap: 16px; height: 32px; }
        .radio-item { display: flex; align-items: center; gap: 4px; font-size: 13px; cursor: pointer; margin: 0; }
        fieldset { border: none; padding: 0; margin: 0; }
        .grid-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .grid-table th { background-color: #f0f0f0; border: 1px solid #ccc; padding: 6px; font-size: 13px; font-weight: bold; text-align: center; color: #333; }
        .grid-table td { border: 1px solid #ccc; padding: 2px; text-align: center; background-color: #fff; }
        .grid-table input[type="text"] { width: 100%; height: 26px; border: none; padding: 0 4px; outline: none; font-size: 13px; box-sizing: border-box; text-align: center; }
        .grid-table input[readonly] { background-color: #f9f9f9; color: #666; }
        .btn-ok { background-color: #f0f0f0; border: 1px solid #999; padding: 0 20px; height: 32px; border-radius: 4px; cursor: pointer; font-weight: bold; transition: all 0.2s; }
        .btn-ok:hover { background-color: #e0e0e0; border-color: #666; }

        /* 💡 就是這裡！重新補齊 FT_Label_PACK_INFO 專用的頁籤 CSS */
        .tabs-header { display: flex; border-bottom: 1px solid #ccc; }
        .tab-btn { padding: 6px 36px; cursor: pointer; background: #f0f0f0; border: 1px solid #ccc; border-bottom: none; margin-right: 4px; border-radius: 4px 4px 0 0; font-size: 13px; color: #333; margin-bottom: -1px; }
        .tab-btn.active { background: #fff; font-weight: bold; border-bottom: 1px solid #fff; }
        .tab-content { border: 1px solid #ccc; padding: 20px; border-radius: 0 4px 4px 4px; background: #f9f9f9; }
    </style>
</head>
<body>
    <div id="app" class="page-layout" data-app>
        <mes-toolbar title="Print BarCode Label"></mes-toolbar>
        
        <div class="page-body">
            <mes-action-bar :buttons="actionButtons" :auto-add-close="true" @action="onAction"></mes-action-bar>

            <!-- 基礎列印條件區塊 -->
            <div class="form-panel">
                <div class="form-list-layout">
                    
                    <label class="field-label">Stage :</label>
                    <select class="form-control" v-model="form.stage" @change="onStageChange">
                        <option value="">-- Select Stage --</option>
                        <option v-for="opt in options.stages" :key="opt" :value="opt">{{ opt }}</option>
                    </select>

                    <label class="field-label">Label Type :</label>
                    <select class="form-control" v-model="form.labelFormat" @change="onLabelFormatChange">
                        <option value="">-- Select Format --</option>
                        <option v-for="opt in options.labelFormats" :key="opt" :value="opt">{{ opt }}</option>
                    </select>

                    <label class="field-label" v-show="!isLotListEnabled && !isBoxCountingMode && !isEtestMergeMode && !isLabelPackEnabled && !isTrLabelMode && !isSubLabelMode && !isRenesasMode && !isWsSummaryMode && !isWsEngShelfMode">Label Data :</label>
                    <input type="text" class="form-control" v-model="form.labelData" placeholder="輸入 Lot ID 或 Wafer ID" v-show="!isLotListEnabled && !isBoxCountingMode && !isEtestMergeMode && !isLabelPackEnabled && !isTrLabelMode && !isSubLabelMode && !isRenesasMode && !isWsSummaryMode && !isWsEngShelfMode">

                    <template v-if="!isBinCardMode && !isBoxCountingMode && !isEtestMergeMode && !isFtLotInfoMode && !isLabelPackEnabled && !isTrLabelMode && !isSubLabelMode && !isCpVirtualMode && !isRenesasMode && !isWsSummaryMode && !isWsEngShelfMode && !isSmallLabelMode">
                        <label class="field-label">Print Mode :</label>
                        <div class="radio-group">
                            <label class="radio-item"><input type="radio" v-model="form.printMode" value="Normal" @change="onPrintModeChange"> Normal</label>
                            <label class="radio-item"><input type="radio" v-model="form.printMode" value="Reprint" @change="onPrintModeChange"> Reprint</label>
                            <label class="radio-item"><input type="radio" v-model="form.printMode" value="Modify" @change="onPrintModeChange"> Modify</label>
                        </div>
                    </template>

                    <label class="field-label">Printer Server :</label>
                    <select class="form-control" v-model="form.printerServer">
                        <option value="">-- Select Server --</option>
                        <option v-for="opt in options.printerServers" :key="opt" :value="opt">{{ opt }}</option>
                    </select>

                    <template v-if="!isBinCardMode && !isBoxCountingMode && !isFtLotInfoMode && !isLabelPackEnabled && !isTrLabelMode">
                        <label class="field-label">Box Qty :</label>
                        <input type="number" class="form-control" v-model.number="form.boxQty" min="1" :disabled="!isBoxQtyEnabled">
                    </template>

                    <template v-if="!isBinCardMode">
                        <label class="field-label">列印份數 :</label>
                        <input type="number" class="form-control" v-model.number="form.printQty" min="1" max="99">
                    </template>

                    <!-- FT_BIN_CARD 專屬輸入區塊 -->
                    <template v-if="isBinCardMode">
                        <label class="field-label">Pass Sheet :</label>
                        <div style="display: flex; gap: 8px;">
                            <input type="number" class="form-control" v-model.number="form.passSheet" min="1">
                            <button type="button" class="btn-ok" @click="doPrintBinCard(true)">OK</button>
                        </div>
                        <label class="field-label">Fail Sheet :</label>
                        <div style="display: flex; gap: 8px;">
                            <input type="number" class="form-control" v-model.number="form.failSheet" min="1">
                            <button type="button" class="btn-ok" @click="doPrintBinCard(false)">OK</button>
                        </div>
                    </template>

                </div>
            </div>

            <!-- 💡 重新補回完整的 FT_Label_PACK_INFO 專屬頁籤區塊 -->
            <div class="form-panel" v-show="isLabelPackEnabled">
                <div class="form-title"><i class="mdi mdi-package-variant"></i> Label Pack Info.</div>
                
                <!-- 頁籤標題列 -->
                <div class="tabs-header">
                    <div class="tab-btn" :class="{ active: form.lpiMode === 'Auto' }" @click="setLpiMode('Auto')">Auto</div>
                    <div class="tab-btn" :class="{ active: form.lpiMode === 'Manual' }" @click="setLpiMode('Manual')">Manual</div>
                </div>

                <!-- 頁籤內容區 -->
                <div class="tab-content">
                    
                    <!-- Auto 模式內容 -->
                    <div class="form-list-layout" v-show="form.lpiMode === 'Auto'">
                        <label class="field-label">LOT NO :</label>
                        <input type="text" class="form-control" v-model="form.labelData" placeholder="輸入 LOT NO">
                    </div>

                    <!-- Manual 模式內容 (六層連動) -->
                    <div class="form-list-layout" v-show="form.lpiMode === 'Manual'">
                        <label class="field-label">LABEL SPEC NO :</label>
                        <select class="form-control" v-model="form.lpiLabelSpecNo" @change="onLpiLabelSpecChange">
                            <option value="">-- Select Label Spec --</option>
                            <option v-for="opt in options.lpiLabelSpecs" :key="opt" :value="opt">{{ opt }}</option>
                        </select>

                        <label class="field-label">CARRIER TYPE :</label>
                        <select class="form-control" v-model="form.carrierType" @change="onCarrierTypeChange" :disabled="!form.lpiLabelSpecNo">
                            <option value="">-- Select Carrier Type --</option>
                            <option v-for="opt in options.carrierTypes" :key="opt" :value="opt">{{ opt }}</option>
                        </select>

                        <label class="field-label">BOXING SPEC NO :</label>
                        <select class="form-control" v-model="form.boxingSpecNo" @change="onBoxingSpecChange" :disabled="!form.carrierType">
                            <option value="">-- Select Boxing Spec --</option>
                            <option v-for="opt in options.boxingSpecs" :key="opt" :value="opt">{{ opt }}</option>
                        </select>

                        <label class="field-label">BRAND :</label>
                        <select class="form-control" v-model="form.brand" @change="onBrandChange" :disabled="!form.boxingSpecNo">
                            <option value="">-- Select Brand --</option>
                            <option v-for="opt in options.brands" :key="opt" :value="opt">{{ opt }}</option>
                        </select>

                        <label class="field-label">PIN COUNT :</label>
                        <select class="form-control" v-model="form.pinCount" @change="onPinCountChange" :disabled="!form.brand">
                            <option value="">-- Select Pin Count --</option>
                            <option v-for="opt in options.pinCounts" :key="opt" :value="opt">{{ opt }}</option>
                        </select>

                        <label class="field-label">PACKAGE CODE :</label>
                        <select class="form-control" v-model="form.packageCode" :disabled="!form.pinCount">
                            <option value="">-- Select Package Code --</option>
                            <option v-for="opt in options.packageCodes" :key="opt" :value="opt">{{ opt }}</option>
                        </select>
                    </div>

                </div>
            </div>

            <!-- WS_SUMMARY 專屬 Label Form -->
            <div class="form-panel" v-show="isWsSummaryMode">
                <div class="form-title"><i class="mdi mdi-form-textbox"></i> Label Form</div>
                <div class="form-list-layout" style="background: #f9f9f9; padding: 20px; border: 1px solid #ccc; border-radius: 4px;">
                    <label class="field-label">LOT NO :</label>
                    <input type="text" class="form-control" v-model="form.labelData" placeholder="輸入 LOT NO 後按 Enter" @blur="fetchSubLabelInfo" @keyup.enter="fetchSubLabelInfo">
                    <label class="field-label" v-if="form.labelFormat === 'WSMULTILOT_TO_SFG'">IPN :</label>
                    <label class="field-label" v-else>PRODUCT NO :</label>
                    <input type="text" class="form-control" v-model="form.subProductNo" readonly>
                    <label class="field-label">WAFER QTY :</label>
                    <input type="text" class="form-control" style="width: 50%;" v-model="form.subWaferQty" readonly>
                    <label class="field-label" v-if="form.labelFormat === 'WSMULTILOT_TO_SFG'">CHIP QTY :</label>
                    <label class="field-label" v-else>QUANTITY :</label>
                    <input type="text" class="form-control" style="width: 50%;" v-model="form.subQty" readonly>
                    <label class="field-label">USER ID :</label>
                    <input type="text" class="form-control" style="width: 50%;" v-model="form.subPacker" readonly>
                </div>
            </div>

            <!-- RENESAS_SHIPPING 專屬 Label Form -->
            <div class="form-panel" v-show="isRenesasMode">
                <div class="form-title"><i class="mdi mdi-form-textbox"></i> Label Form</div>
                <div class="form-list-layout" style="background: #f9f9f9; padding: 20px; border: 1px solid #ccc; border-radius: 4px;">
                    <label class="field-label">LOT NO :</label>
                    <input type="text" class="form-control" v-model="form.labelData" placeholder="輸入 LOT NO 後按 Enter" @blur="fetchSubLabelInfo" @keyup.enter="fetchSubLabelInfo">
                    <label class="field-label">PRODUCT NO :</label>
                    <input type="text" class="form-control" v-model="form.subProductNo" readonly>
                    <label class="field-label">PART NO :</label>
                    <input type="text" class="form-control" v-model="form.subPartNo" readonly>
                    <label class="field-label">WAFER QTY :</label>
                    <input type="text" class="form-control" style="width: 50%;" v-model="form.subWaferQty" readonly>
                    <label class="field-label">QUANTITY :</label>
                    <div style="display: flex; gap: 20px; align-items: center;">
                        <input type="text" class="form-control" style="width: 150px;" v-model="form.subQty" readonly>
                        <label style="font-size: 13px; font-weight: bold;">USERID :</label>
                        <input type="text" class="form-control" style="width: 150px;" v-model="form.subPacker" readonly>
                    </div>
                </div>
            </div>

            <!-- TO_SUB 系列專屬 Label Form -->
            <div class="form-panel" v-show="isSubLabelMode">
                <div class="form-title"><i class="mdi mdi-form-textbox"></i> Label Form</div>
                <div class="form-list-layout" style="background: #f9f9f9; padding: 20px; border: 1px solid #ccc; border-radius: 4px;">
                    <label class="field-label">(1T) LOT NO :</label>
                    <input type="text" class="form-control" v-model="form.labelData" placeholder="輸入 LOT NO 後按 Enter" @blur="fetchSubLabelInfo" @keyup.enter="fetchSubLabelInfo">
                    <label class="field-label">(1P) PRODUCT NO :</label>
                    <input type="text" class="form-control" v-model="form.subProductNo" readonly>
                    <label class="field-label">(Q) QUANTITY :</label>
                    <input type="text" class="form-control" v-model="form.subQty" readonly>
                    <label class="field-label">PACKER :</label>
                    <input type="text" class="form-control" v-model="form.subPacker" readonly>
                </div>
            </div>

            <!-- FT_TR_LABEL 專屬資訊框 -->
            <div class="form-panel" v-show="isTrLabelMode">
                <div class="form-title"><i class="mdi mdi-package-variant"></i> Label Pack Info.</div>
                <div class="form-list-layout" style="background: #f9f9f9; padding: 20px; border: 1px solid #ccc; border-radius: 4px;">
                    <label class="field-label">Lot NO :</label>
                    <input type="text" class="form-control" v-model="form.labelData" placeholder="輸入 Lot NO 後按 Enter" @blur="fetchTrLabelInfo" @keyup.enter="fetchTrLabelInfo">
                    <label class="field-label">IPN :</label>
                    <input type="text" class="form-control" v-model="form.trIpn" readonly>
                    <label class="field-label">Qty/ Reel :</label>
                    <input type="number" class="form-control" v-model.number="form.trQtyReel" @change="fetchTrLabelInfo" min="1">
                    <label class="field-label">Eq ID :</label>
                    <input type="text" class="form-control" v-model="form.searchData" placeholder="輸入 Eq ID">
                    <label class="field-label">Reel ID :</label>
                    <select class="form-control" v-model="form.trReelId">
                        <option value="">-- 請選擇 --</option>
                        <option v-for="opt in options.trReelIds" :key="opt" :value="opt">{{ opt }}</option>
                    </select>
                </div>
            </div>

            <!-- FT_BOX_COUNTING 專屬區塊 -->
            <div class="form-panel" v-show="isBoxCountingMode">
                <div class="form-title"><i class="mdi mdi-form-textbox"></i> Label Form</div>
                <div class="form-list-layout">
                    <label class="field-label">LOT NO :</label>
                    <input type="text" class="form-control" v-model="form.labelData" placeholder="輸入 LOT NO">
                </div>
            </div>

            <!-- FT_ETEST_MERGE_LABEL 專屬區塊 -->
            <div class="form-panel" v-show="isEtestMergeMode">
                <div class="form-title"><i class="mdi mdi-form-textbox"></i> Label Form</div>
                <div style="display: flex; gap: 20px; align-items: center; margin-bottom: 12px; padding-left: 20px;">
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <label style="font-size: 13px; font-weight: bold; width: 100px; text-align: right;">(1T) LOT NO:</label>
                        <input type="text" class="form-control" style="width: 200px;" v-model="form.labelData" @blur="fetchEtestInfo" @keyup.enter="fetchEtestInfo">
                    </div>
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <label style="font-size: 13px; font-weight: bold; width: 40px; text-align: right;">QTY:</label>
                        <input type="text" class="form-control" style="width: 120px; background-color: #d1d5db;" v-model="form.totalQty" readonly>
                    </div>
                </div>
                <div style="width: 60%; margin: 0 auto;">
                    <table class="grid-table">
                        <thead>
                            <tr><th style="width: 40px;"></th><th>ChildLotID</th><th>Qty</th></tr>
                        </thead>
                        <tbody>
                            <tr v-for="(row, index) in etestList" :key="index">
                                <td style="background-color: #f0f0f0; border-right: 1px solid #999;">{{ index + 1 }}</td>
                                <td><input type="text" v-model="row.childLotId" readonly></td>
                                <td><input type="text" v-model="row.qty" readonly></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- WS_ENG_SHELF 專屬精簡版 Lot List 表格 -->
            <div class="form-panel" v-show="isWsEngShelfMode">
                <div class="form-title"><i class="mdi mdi-table"></i> Lot List</div>
                <div style="overflow-x: auto; max-height: 300px; overflow-y: auto;">
                    <table class="grid-table">
                        <thead>
                            <tr>
                                <th style="width: 40px;">No.</th>
                                <th style="width: 40px;"><input type="checkbox" @change="toggleAllLots" v-model="allLotsChecked"></th>
                                <th style="width: 150px;">Lot No</th>
                                <th style="width: 100px;">WQty</th>
                                <th style="width: 120px;">OwnerID</th>
                                <th style="width: 120px;">OwnerDep</th>
                                <th style="width: 40px;"></th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr v-for="(row, index) in lotList" :key="index">
                                <td>{{ index + 1 }}</td>
                                <td><input type="checkbox" v-model="row.checked"></td>
                                <td>
                                    <input type="text" ref="engShelfInputs" v-model="row.lotNo"
                                           @blur="fetchLotInfo(row)" @keyup.enter="handleEnter(row, index, 'engShelfInputs')"
                                           @keydown.down.prevent="handleDown(index, 'engShelfInputs')" @keydown.up.prevent="handleUp(index, 'engShelfInputs')">
                                </td>
                                <td><input type="text" v-model="row.waferQty" readonly></td>
                                <td><input type="text" v-model="row.lotOwner" readonly></td>
                                <td><input type="text" v-model="row.route" readonly></td>
                                <td>
                                    <button type="button" @click="removeRow(index)" title="刪除此列" style="border: none; background: transparent; cursor: pointer; color: #d32f2f; font-weight: bold;">✖</button>
                                </td>
                            </tr>
                            <tr>
                                <td colspan="7" style="text-align: left; padding: 4px;">
                                    <button type="button" @click="addNewRow" style="border: 1px dashed #ccc; background: #f9f9f9; padding: 4px 12px; cursor: pointer; color: #1565C0; font-size: 13px; width: 100%;">
                                        ➕ 點擊或按 [ ↓ ] 向下新增一列
                                    </button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- 原本的 Lot List 區塊 -->
            <div class="form-panel" v-show="isLotListEnabled">
                <div class="form-title"><i class="mdi mdi-table"></i> Lot List</div>
                <div style="overflow-x: auto; max-height: 300px; overflow-y: auto;">
                    <table class="grid-table">
<thead>
                            <tr>
                                <th style="width: 40px;">No.</th>
                                <th style="width: 40px;"><input type="checkbox" @change="toggleAllLots" v-model="allLotsChecked"></th>
                                <th style="width: 150px;">Lot NO</th>
                                <th style="width: 150px;">Product NO</th>
                                <!-- 💡 Small Label 隱藏 Wafer Qty -->
                                <th style="width: 80px;" v-show="!isBinCardMode && !isFtLotInfoMode && !isSmallLabelMode">Wafer Qty</th>
                                <th style="width: 80px;">Chip Qty</th>
                                <th style="width: 100px;" v-show="!isCpVirtualMode">Lot Owner</th>
                                <!-- 💡 Small Label 隱藏 Speed -->
                                <th style="width: 100px;" v-show="!isBinCardMode && !isFtLotInfoMode && !isCpVirtualMode && !isSmallLabelMode">Speed</th>
                                <th style="width: 100px;" v-show="isBinCardMode || isFtLotInfoMode || isSmallLabelMode">Route</th>
                                <th style="width: 100px;" v-show="isBinCardMode">Step</th>
                                <th style="width: 40px;"></th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr v-for="(row, index) in lotList" :key="index">
                                <td>{{ index + 1 }}</td>
                                <td><input type="checkbox" v-model="row.checked"></td>
                                <td>
                                    <input type="text" ref="lotInputs" v-model="row.lotNo"
                                           @blur="fetchLotInfo(row)" @keyup.enter="handleEnter(row, index, 'lotInputs')"
                                           @keydown.down.prevent="handleDown(index, 'lotInputs')" @keydown.up.prevent="handleUp(index, 'lotInputs')">
                                </td>
                                <td><input type="text" v-model="row.productNo" readonly></td>
                                <!-- 💡 對應隱藏 Wafer Qty -->
                                <td v-show="!isBinCardMode && !isFtLotInfoMode && !isSmallLabelMode"><input type="text" v-model="row.waferQty" readonly></td>
                                <td><input type="text" v-model="row.chipQty" readonly></td>
                                <td v-show="!isCpVirtualMode"><input type="text" v-model="row.lotOwner" readonly></td>
                                <!-- 💡 對應隱藏 Speed -->
                                <td v-show="!isBinCardMode && !isFtLotInfoMode && !isCpVirtualMode && !isSmallLabelMode"><input type="text" v-model="row.speed" readonly></td>
                                <td v-show="isBinCardMode || isFtLotInfoMode || isSmallLabelMode"><input type="text" v-model="row.route" readonly></td>
                                <td v-show="isBinCardMode"><input type="text" v-model="row.step" readonly></td>
                                <td>
                                    <button type="button" @click="removeRow(index)" title="刪除此列" style="border: none; background: transparent; cursor: pointer; color: #d32f2f; font-weight: bold;">✖</button>
                                </td>
                            </tr>
                            <tr>
                                <td colspan="15" style="text-align: left; padding: 4px;">
                                    <button type="button" @click="addNewRow" style="border: 1px dashed #ccc; background: #f9f9f9; padding: 4px 12px; cursor: pointer; color: #1565C0; font-size: 13px; width: 100%;">
                                        ➕ 點擊或按 [ ↓ ] 向下新增一列
                                    </button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Reprint 補印專用區塊 -->
            <div class="form-panel" v-show="form.printMode === 'Reprint' && !isBinCardMode && !isBoxCountingMode && !isFtLotInfoMode && !isLabelPackEnabled && !isCpVirtualMode && !isWsEngShelfMode">
                <div class="form-title"><i class="mdi mdi-refresh"></i> Reprint Info.</div>
                <div class="form-list-layout">
                    <label class="field-label">Search Type :</label>
                    <div class="radio-group">
                        <label class="radio-item"><input type="radio" v-model="form.reprintType" value="LastLabel"> Print Last Label</label>
                        <label class="radio-item"><input type="radio" v-model="form.reprintType" value="SearchData"> Search by Data</label>
                    </div>
                    <label class="field-label">Search Data :</label>
                    <input type="text" class="form-control" v-model="form.searchData" placeholder="輸入搜尋條件" :disabled="form.reprintType !== 'SearchData'">
                </div>
            </div>

        </div>
        <mes-statusbar :msg="statusMsg" :msg-type="statusMsgType"></mes-statusbar>
    </div>

    <script src="/Scripts/vue.min.js"></script>
    <script src="/Scripts/vuetify.min.js"></script>
    <script src="/Scripts/slimselect.js"></script>
    <script src="/Scripts/mes-util.js?v=260522"></script>
    <script src="/Scripts/mes-action-bar.js"></script>

    <script>
        Vue.use(VMessageBox);

        var vapp = new Vue({
            el: '#app',
            data() {
                return {
                    form: {
                        stage: '', labelFormat: '', labelData: '', printMode: 'Normal', printerServer: '',
                        boxQty: 1, printQty: 1, reprintType: 'LastLabel', searchData: '',
                        passSheet: 1, failSheet: 1, totalQty: '',
                        lpiMode: 'Auto', lpiLabelSpecNo: '', carrierType: '', boxingSpecNo: '', brand: '', pinCount: '', packageCode: '',
                        trIpn: '', trQtyReel: '', trReelId: '',
                        subProductNo: '', subQty: '', subPacker: '', subPartNo: '', subWaferQty: ''
                    },
                    options: { stages: [], labelFormats: [], printerServers: [], lpiLabelSpecs: [], carrierTypes: [], boxingSpecs: [], brands: [], pinCounts: [], packageCodes: [], trReelIds: [] },
                    lotList: [], etestList: [], allLotsChecked: false, statusMsg: 'READY', statusMsgType: ''
                };
            },
computed: {
                actionButtons() { return [{ action: 'print', label: 'Print', icon: 'mdi-printer', color: 'primary' }, { action: 'clear', label: 'Clear', icon: 'mdi-eraser' }]; },
                
                isBinCardMode() { return this.form.labelFormat === 'FT_BIN_CARD_LABEL' || this.form.labelFormat === 'FT_BIN_CARD'; },
                isBoxCountingMode() { return this.form.labelFormat === 'FT_BOX_COUNTING'; },
                isEtestMergeMode() { return this.form.labelFormat === 'FT_ETEST_MERGE_LABEL' || this.form.labelFormat === 'FT_ETEST_MERGE'; },
                isFtLotInfoMode() { return this.form.labelFormat === 'FT_LOT_INFO'; },
                isLabelPackEnabled() { return this.form.labelFormat === 'FT_Label_PACK_INFO'; },
                isTrLabelMode() { return this.form.labelFormat === 'FT_TR_LABEL'; },
                isRenesasMode() { return this.form.labelFormat === 'RENESAS_SHIPPING'; },
                isWsEngShelfMode() { return this.form.labelFormat === 'WS_ENG_SHELF' || this.form.labelFormat === 'WS_ENG_LOC_LABEL'; },
                
                // 💡 新增：Small Label 系列判斷
                isSmallLabelMode() {
                    const smallLabels = ['FT_SMALL_LABEL', 'WS_SMALL_LABEL', 'CP_SMALL_LABEL'];
                    return smallLabels.includes(this.form.labelFormat);
                },

                isSubLabelMode() {
                    const subLabels = ['TO_SUBFT_ENG_SAMPLE', 'TO_SUBFT_NORMAL', 'TO_SUBMK_ENG_SAMPLE', 'TO_SUBMK_NORMAL', 'TO_SUBTR_ENG_SAMPLE', 'TO_SUBTR_NORMAL'];
                    return subLabels.includes(this.form.labelFormat);
                },
                
                isWsSummaryMode() { 
                    const summaryLabels = ['WSMULTILOT_TO_SFG', 'WS_DGRADE_SUMMARY', 'WS_SUMMARY'];
                    return summaryLabels.includes(this.form.labelFormat); 
                },

                isCpVirtualMode() { return this.form.labelFormat === 'CP_VIRTUAL_LOT_LABEL' || this.form.labelFormat === 'CP_VIRTUAL_MERGE'; },

                isLotListEnabled() {
                    const listFormats = ['WS_SMALL_LABEL', 'FT_SMALL_LABEL', 'CP_SMALL_LABEL', 'FT_BIN_CARD_LABEL', 'FT_BIN_CARD', 'FT_LOT_INFO', 'CP_VIRTUAL_LOT_LABEL', 'CP_VIRTUAL_MERGE'];
                    return listFormats.includes(this.form.labelFormat);
                },
                
                // 💡 更新：Small Label 也不顯示 BoxQty
                isBoxQtyEnabled() {
                    const singleLabels = [
                        "FT_SMALL_LABEL", "CP_SMALL_LABEL", "WS_SMALL_LABEL", 
                        "CP_VIRTUAL_LOT_LABEL", "CP_VIRTUAL_MERGE", 
                        "FT_LOT_INFO", "FT_Label_PACK_INFO", 
                        "FT_TR_LABEL", "FT_BOX_COUNTING", 
                        "FT_BIN_CARD_LABEL", "FT_BIN_CARD", 
                        "FT_ETEST_MERGE_LABEL", "FT_ETEST_MERGE", 
                        "WS_ENG_LOC_LABEL", "WS_ENG_SHELF"
                    ];
                    return !singleLabels.includes(this.form.labelFormat);
                }
            },
            mounted() { 
                this.loadInitData(); 
                let currentUserId = sessionStorage.getItem('mes_loginId');
                if (!currentUserId && window.checkAuth) currentUserId = window.checkAuth().userName;
                this.form.subPacker = currentUserId || 'System';
            },
            methods: {
                // 💡 LPI 頁籤切換邏輯
                setLpiMode(mode) {
                    this.form.lpiMode = mode;
                    if (mode === 'Auto') {
                        this.clearLpiDropdowns(0);
                    } else {
                        this.form.labelData = ''; 
                        if (this.options.lpiLabelSpecs.length === 0) {
                            this.loadLpiLabelSpecs();
                        }
                    }
                },
                
                // LPI 下拉連動邏輯
                async loadLpiLabelSpecs() {
                    try {
                        const response = await mesfetch("/api/print/print-label/lpi-label-specs", {});
                        if (response.Success) this.options.lpiLabelSpecs = response.Data;
                    } catch (error) { console.error(error); }
                },
                async onLpiLabelSpecChange() {
                    this.clearLpiDropdowns(1); if (!this.form.lpiLabelSpecNo) return;
                    try {
                        const response = await mesfetch("/api/print/print-label/lpi-carrier-types", { LabelSpecNo: this.form.lpiLabelSpecNo });
                        if (response.Success) this.options.carrierTypes = response.Data;
                    } catch (error) { console.error(error); }
                },
                async onCarrierTypeChange() {
                    this.clearLpiDropdowns(2); if (!this.form.carrierType) return;
                    try {
                        const response = await mesfetch("/api/print/print-label/lpi-boxing-specs", { CarrierType: this.form.carrierType });
                        if (response.Success) this.options.boxingSpecs = response.Data;
                    } catch (error) { console.error(error); }
                },
                async onBoxingSpecChange() {
                    this.clearLpiDropdowns(3); if (!this.form.boxingSpecNo) return;
                    try {
                        const response = await mesfetch("/api/print/print-label/lpi-brands", { CarrierType: this.form.carrierType, BoxingSpecNo: this.form.boxingSpecNo });
                        if (response.Success) this.options.brands = response.Data;
                    } catch (error) { console.error(error); }
                },
                async onBrandChange() {
                    this.clearLpiDropdowns(4); if (!this.form.brand) return;
                    try {
                        const response = await mesfetch("/api/print/print-label/lpi-pin-counts", { CarrierType: this.form.carrierType, BoxingSpecNo: this.form.boxingSpecNo, Brand: this.form.brand });
                        if (response.Success) this.options.pinCounts = response.Data;
                    } catch (error) { console.error(error); }
                },
                async onPinCountChange() {
                    this.clearLpiDropdowns(5); if (!this.form.pinCount) return;
                    try {
                        const response = await mesfetch("/api/print/print-label/package-codes", { CarrierType: this.form.carrierType, BoxingSpecNo: this.form.boxingSpecNo, Brand: this.form.brand, PinCount: this.form.pinCount });
                        if (response.Success) this.options.packageCodes = response.Data;
                    } catch (error) { console.error(error); }
                },
                clearLpiDropdowns(level) {
                    if (level <= 1) { this.form.carrierType = ''; this.options.carrierTypes = []; }
                    if (level <= 2) { this.form.boxingSpecNo = ''; this.options.boxingSpecs = []; }
                    if (level <= 3) { this.form.brand = ''; this.options.brands = []; }
                    if (level <= 4) { this.form.pinCount = ''; this.options.pinCounts = []; }
                    if (level <= 5) { this.form.packageCode = ''; this.options.packageCodes = []; }
                },

                // 💡 共用 SubLabel / Renesas / WsSummary 查詢
                async fetchSubLabelInfo() {
                    if (!this.form.labelData) {
                        this.form.subProductNo = ''; this.form.subQty = '';
                        this.form.subPartNo = ''; this.form.subWaferQty = '';
                        return;
                    }
                    try {
                        const response = await mesfetch("/api/print/print-label/lot-info", { LotId: this.form.labelData.trim(), LabelFormat: this.form.labelFormat });
                        if (response.Success && response.Data) {
                            this.form.subProductNo = response.Data.ProductNo || '';
                            this.form.subQty = response.Data.ChipQty || '';
                            this.form.subPartNo = response.Data.PartNo || '';
                            this.form.subWaferQty = response.Data.WaferQty || '';
                        } else {
                            VMessageBox.alert(response.Message || '查無此批號');
                            this.form.subProductNo = ''; this.form.subQty = '';
                            this.form.subPartNo = ''; this.form.subWaferQty = '';
                        }
                    } catch (e) { console.error(e); }
                },

                // 💡 TR Label 查詢
                async fetchTrLabelInfo() {
                    if (!this.form.labelData) {
                        this.form.trIpn = ''; this.form.trQtyReel = ''; this.options.trReelIds = []; this.form.trReelId = '';
                        return;
                    }
                    try {
                        const payload = { LotId: this.form.labelData.trim(), OverrideQtyReel: this.form.trQtyReel ? parseInt(this.form.trQtyReel) : null };
                        const response = await mesfetch("/api/print/print-label/tr-label-info", payload);
                        if (response.Success && response.Data) {
                            this.form.trIpn = response.Data.Ipn || '';
                            this.form.trQtyReel = response.Data.QtyReel || '';
                            this.options.trReelIds = response.Data.ReelIds || response.Data.reelIds || [];
                            if(this.options.trReelIds.length > 0) this.form.trReelId = 'All';
                        } else {
                            VMessageBox.alert(response.Message || '查無此批號資訊');
                            this.options.trReelIds = []; this.form.trReelId = '';
                        }
                    } catch (e) { console.error(e); }
                },

                // 💡 ETest Merge 查詢
                initEtestList() { this.etestList = []; for (let i = 0; i < 5; i++) { this.etestList.push({ childLotId: '', qty: '' }); } },
                async fetchEtestInfo() {
                    if (!this.form.labelData) { this.form.totalQty = ''; this.initEtestList(); return; }
                    try {
                        const response = await mesfetch("/api/print/print-label/etest-merge-info", { LotId: this.form.labelData.trim() });
                        if (response.Success && response.Data) {
                            this.form.totalQty = response.Data.TotalQty || '';
                            let lotsFromApi = response.Data.ChildLots || response.Data.childLots || [];
                            this.etestList = lotsFromApi.map(item => ({ childLotId: item.ChildLotId || item.childLotId || '', qty: item.Qty || item.qty || '' }));
                            while (this.etestList.length < 5) { this.etestList.push({ childLotId: '', qty: '' }); }
                        } else {
                            VMessageBox.alert(response.Message || '查無此批號的 Merge 資訊');
                            this.form.totalQty = ''; this.initEtestList();
                        }
                    } catch (e) { console.error(e); this.form.totalQty = ''; this.initEtestList(); }
                },

                // 💡 Lot List 與方向鍵邏輯
                initLotList() {
                    this.lotList = [];
                    for (let i = 0; i < 10; i++) { this.lotList.push({ checked: false, lotNo: '', productNo: '', waferQty: '', chipQty: '', lotOwner: '', speed: '', route: '', step: '' }); }
                },
                toggleAllLots() { this.lotList.forEach(row => { row.checked = this.allLotsChecked; }); },
                addNewRow() { this.lotList.push({ checked: false, lotNo: '', productNo: '', waferQty: '', chipQty: '', lotOwner: '', speed: '', route: '', step: '' }); },
                removeRow(index) { this.lotList.splice(index, 1); if (this.lotList.length === 0) this.addNewRow(); },
                handleDown(index, refName = 'lotInputs') {
                    if (index === this.lotList.length - 1) this.addNewRow();
                    this.$nextTick(() => { if (this.$refs[refName] && this.$refs[refName][index + 1]) this.$refs[refName][index + 1].focus(); });
                },
                handleUp(index, refName = 'lotInputs') { 
                    if (index > 0 && this.$refs[refName] && this.$refs[refName][index - 1]) this.$refs[refName][index - 1].focus(); 
                },
                handleEnter(row, index, refName = 'lotInputs') { this.fetchLotInfo(row); this.handleDown(index, refName); },

                async fetchLotInfo(row) {
                    if (!row.lotNo) {
                        row.productNo = ''; row.waferQty = ''; row.chipQty = ''; row.lotOwner = ''; row.speed = ''; row.route = ''; row.step = ''; row.checked = false;
                        return;
                    }
                    try {
                        const response = await mesfetch("/api/print/print-label/lot-info", { LotId: row.lotNo, LabelFormat: this.form.labelFormat });
                        if (response.Success && response.Data) {
                            row.productNo = response.Data.ProductNo || ''; row.waferQty = response.Data.WaferQty || ''; row.chipQty = response.Data.ChipQty || '';
                            row.lotOwner = response.Data.LotOwner || ''; row.speed = response.Data.Speed || ''; row.route = response.Data.Route || ''; row.step = response.Data.Step || '';
                            row.checked = true;
                        } else { VMessageBox.alert(response.Message || '查無此批號'); row.checked = false; }
                    } catch (e) { console.error(e); row.checked = false; }
                },

                // 💡 選單連動初始化
                async loadInitData() {
                    try {
                        const response = await mesfetch("/api/print/print-label/init", {});
                        if (response.Success && response.Data) {
                            this.options.stages = response.Data.Stages || [];
                            this.options.labelFormats = response.Data.LabelFormats || [];
                            this.options.printerServers = response.Data.PrinterServers || [];
                        }
                    } catch (error) { console.error(error); }
                },
                async onStageChange() {
                    this.form.labelFormat = ''; this.options.labelFormats = []; this.form.printerServer = '';
                    if (!this.form.stage) return;
                    try {
                        const response = await mesfetch("/api/print/print-label/label-formats", { Stage: this.form.stage });
                        if (response.Success) this.options.labelFormats = response.Data;
                    } catch (error) { console.error(error); }
                },
                async onLabelFormatChange() {
                    this.form.printerServer = '';
                    if (!this.form.stage || !this.form.labelFormat) return;
                    
                    if (this.isLotListEnabled || this.isWsEngShelfMode) this.initLotList();
                    if (this.isEtestMergeMode) { this.form.labelData = ''; this.form.totalQty = ''; this.initEtestList(); }
                    if (this.isLabelPackEnabled) { this.setLpiMode('Auto'); this.form.labelData = ''; }
                    
                    if (this.isSubLabelMode || this.isRenesasMode || this.isWsSummaryMode) {
                        this.form.labelData = ''; this.form.subProductNo = ''; this.form.subQty = '';
                        this.form.subPartNo = ''; this.form.subWaferQty = '';
                    }

                    try {
                        const response = await mesfetch("/api/print/print-label/mapped-servers", { Stage: this.form.stage, LabelFormat: this.form.labelFormat });
                        if (response.Success) this.options.printerServers = response.Data;
                    } catch (error) { console.error(error); }
                },
                onPrintModeChange() { if (this.form.printMode !== 'Reprint') this.form.searchData = ''; },

                // 💡 列印觸發邏輯
                async doPrintBinCard(isPass) {
                    if (!this.form.printerServer) { VMessageBox.alert('Please select Printer Server!'); return; }
                    let targetQty = isPass ? this.form.passSheet : this.form.failSheet;
                    if (!targetQty || targetQty <= 0) { VMessageBox.alert("請輸入有效的列印份數!"); return; }

                    const lotsToPrint = this.lotList.filter(row => row.checked && row.lotNo.trim() !== '');
                    if (lotsToPrint.length === 0) { VMessageBox.alert('Please Select Lot(s)!!'); return; }
                    if (lotsToPrint.length > 1) { VMessageBox.alert('Only can print one Lot(s) once!!'); return; }

                    const targetLot = lotsToPrint[0].lotNo.trim();
                    document.body.style.cursor = 'wait'; this.setStatus('PRINTING...', 'info');

                    const payload = {
                        Stage: this.form.stage, LabelFormat: this.form.labelFormat, LotId: targetLot,
                        PrintMode: 'Normal', PrinterServer: this.form.printerServer, PrintQty: targetQty,
                        IsPass: isPass, UserId: window.checkAuth ? window.checkAuth().userName : 'System'
                    };

                    const res = await this.executeSinglePrint(payload);
                    if (res.Success) { VMessageBox.alert('標籤列印指令已成功送出！'); this.setStatus('PRINT SUCCESS', 'success'); }
                    else { VMessageBox.alert(`列印失敗: ${res.Message}`); this.setStatus('PRINT FAILED', 'error'); }
                    document.body.style.cursor = 'default';
                },

                async doPrint() {
                    if (this.isBinCardMode) { VMessageBox.alert('FT BIN CARD 標籤請使用右方的 Pass / Fail 按鈕進行列印！'); return; }
                    if (!this.form.printerServer || !this.form.labelFormat) { VMessageBox.alert('請選擇完整的伺服器與標籤格式！'); return; }

                    // 💡 將 lotsToPrint 升級為「物件陣列」，以便儲存 LotId, IPN, 數量等附加資訊
                    let lotsToPrint = [];
                    
                    if (this.isSubLabelMode || this.isRenesasMode || this.isWsSummaryMode) {
                        if (!this.form.labelData.trim() || !this.form.subProductNo) { VMessageBox.alert('請輸入 LOT NO 並確認批號資訊已載入！'); return; }
                        if (this.form.boxQty <= 0) { VMessageBox.alert('請輸入正確的 Box Qty (箱數)！'); return; }
                        lotsToPrint.push({ 
                            lotId: this.form.labelData.trim(), 
                            ipn: this.form.subProductNo, 
                            cQty: this.form.subQty, 
                            wQty: this.form.subWaferQty 
                        });
                    }
                    else if (this.isTrLabelMode) {
                        if (!this.form.labelData.trim() || !this.form.trReelId) { VMessageBox.alert('請輸入 Lot NO 並確認 Reel ID 是否選定！'); return; }
                        lotsToPrint.push({ 
                            lotId: this.form.labelData.trim(), 
                            ipn: this.form.trIpn, 
                            waferId: this.form.trReelId 
                        });
                    }
                    else if (this.isLabelPackEnabled) {
                        // 💡 修正：針對 FT_Label_PACK_INFO 區分 Auto 與 Manual
                        if (this.form.lpiMode === 'Manual') {
                            if (!this.form.lpiLabelSpecNo || !this.form.packageCode) { VMessageBox.alert('請選擇完整的 Label Pack 手動參數！'); return; }
                            lotsToPrint.push({ lotId: '', ipn: '' }); // 手動模式不依賴 IPN 查詢
                        } else {
                            if (!this.form.labelData.trim()) { VMessageBox.alert('Auto 模式請輸入 LOT NO！'); return; }
                            // 💡 關鍵：Auto 模式下，必須確保 IPN 有被傳入 (我們可以透過額外的欄位或直接送出讓後端去查)
                            lotsToPrint.push({ 
                                lotId: this.form.labelData.trim(), 
                                // 若 LPI 畫面上沒有獨立顯示 IPN 的文字框，可以暫時傳空字串，
                                // 並讓後端 C# 在 GetLabelSpecInfoAsync 前主動用 LotId 查一次 IPN
                                ipn: '' 
                            });
                        }
                    } 
                    else if (this.isLotListEnabled || this.isWsEngShelfMode) {
                        lotsToPrint = this.lotList
                            .filter(row => row.checked && row.lotNo.trim() !== '')
                            .map(row => ({
                                lotId: row.lotNo.trim(),
                                ipn: row.productNo,
                                cQty: row.chipQty,
                                wQty: row.waferQty,
                                // 💡 新增：將 lotOwner 與 route 一併收集送出
                                lotOwner: row.lotOwner,
                                route: row.route 
                            }));
                        
                        if (lotsToPrint.length === 0) { VMessageBox.alert('請至少勾選一筆 Lot 才能列印！'); return; }
                    }
                    else {
                        if (!this.form.labelData.trim() && this.form.printMode !== 'Reprint') { VMessageBox.alert('請輸入 LOT NO 或 Label Data！'); return; }
                        lotsToPrint.push({ lotId: this.form.labelData.trim() });
                    }

                    let finalPrintMode = this.form.printMode;
                    if (this.isLabelPackEnabled) finalPrintMode = this.form.lpiMode;
                    if (this.isSubLabelMode || this.isRenesasMode || this.isWsSummaryMode) finalPrintMode = 'Normal'; 

                    document.body.style.cursor = 'wait'; this.setStatus('PRINTING...', 'info');
                    try {
                        let allSuccess = true; let errorMsg = '';
                        
                        for (const item of lotsToPrint) {
                            const payload = {
                                Stage: this.form.stage, 
                                LabelFormat: this.form.labelFormat, 
                                LotId: item.lotId,
                                PrintMode: finalPrintMode, 
                                PrinterServer: this.form.printerServer,
                                BoxQty: this.form.boxQty, 
                                PrintQty: this.form.printQty,
                                SearchData: this.form.searchData,
                                
                                WaferId: item.waferId || '',
                                IPN: item.ipn || '',
                                CQty: item.cQty || '',
                                WQty: item.wQty || '',
                                
                                // 💡 若後端 C# 接收的 PrintLabelRequest 有定義這兩個欄位，就可以接住資料了
                                LotOwner: item.lotOwner || '',
                                Route: item.route || '',
                                
                                UserId: (this.isSubLabelMode || this.isRenesasMode || this.isWsSummaryMode) ? this.form.subPacker : (window.checkAuth ? window.checkAuth().userName : 'System')
                            };
                            
                            if (this.isLabelPackEnabled) {
                                payload.LabelSpecNo = this.form.lpiLabelSpecNo; payload.CarrierType = this.form.carrierType;
                                payload.BoxingSpecNo = this.form.boxingSpecNo; payload.Brand = this.form.brand;
                                payload.PinCount = this.form.pinCount; payload.PackageCode = this.form.packageCode;
                            }
                            
                            const res = await this.executeSinglePrint(payload);
                            if (!res.Success) { allSuccess = false; errorMsg += `Lot [${item.lotId}] 失敗: ${res.Message}\n`; }
                        }
                        
                        if (allSuccess) { VMessageBox.alert('標籤列印指令已全數成功送出！'); this.setStatus('PRINT SUCCESS', 'success'); }
                        else { VMessageBox.alert(errorMsg); this.setStatus('COMPLETED WITH ERRORS', 'warning'); }
                    } finally { document.body.style.cursor = 'default'; }
                },

                doClear() {
                    this.form.stage = ''; this.form.labelFormat = ''; this.form.labelData = ''; this.form.printMode = 'Normal';
                    this.form.printerServer = ''; this.form.boxQty = 1; this.form.printQty = 1; this.form.searchData = '';
                    this.form.passSheet = 1; this.form.failSheet = 1; this.form.totalQty = '';
                    this.form.trIpn = ''; this.form.trQtyReel = ''; this.form.trReelId = ''; this.options.trReelIds = [];
                    this.form.subProductNo = ''; this.form.subQty = ''; this.form.subPartNo = ''; this.form.subWaferQty = '';
                    this.initLotList(); this.initEtestList(); this.setLpiMode('Auto');
                    this.setStatus('CLEARED', '');
                },
                doClose() { window.location.href = '/Content/F5.html'; },
                onAction(action) { const map = { print: this.doPrint, clear: this.doClear, close: this.doClose }; if (map[action]) map[action].call(this); },
                setStatus(msg, type) { this.statusMsg = msg; this.statusMsgType = type || ''; }
            }
        });
    </script>
</body>
